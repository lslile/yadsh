name: CI

# Broad lane: public, no secrets. Builds yadsh from the autotools sources.
# Starts with a Linux build; the RHEL matrix and the *BSD targets are added
# on top of this once it is green.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake

      - name: Regenerate the build system
        run: autoreconf -fi

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Out-of-tree (VPATH) build
        run: |
          make distclean
          mkdir _build
          cd _build
          ../configure
          make
