name: CI

# Broad lane: public, no secrets. Builds yadsh from the autotools sources.
# Ubuntu, an Enterprise-Linux matrix, and a *BSD matrix.
#
# EL7 is intentionally not here: GitHub's actions run on Node 20, which needs
# glibc 2.28+, while RHEL/CentOS 7 ships glibc 2.17, so the action runner
# cannot execute inside an EL7 container. EL7 is covered by the rh7-build host
# in the local pre-push gate instead.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake

      - name: Regenerate the build system
        run: autoreconf -fi

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Test
        run: make check

      - name: Out-of-tree (VPATH) build
        run: |
          make distclean
          mkdir _build
          cd _build
          ../configure
          make

  build-el:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - almalinux:8
          - almalinux:9
          - almalinux:10
    steps:
      - name: Install git (needed by the checkout action)
        run: dnf -y install git

      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf -y install gcc make autoconf automake diffutils grep

      - name: Regenerate the build system
        run: autoreconf -fi

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Test
        run: make check

  build-freebsd:
    name: Build (FreeBSD)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y autoconf automake gmake
          run: |
            autoreconf -fi
            ./configure
            gmake
            gmake check

  build-openbsd:
    name: Build (OpenBSD)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build in an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add -I gmake autoconf%2.72 automake%1.16
          run: |
            export AUTOCONF_VERSION=2.72 AUTOMAKE_VERSION=1.16
            autoreconf -fi
            ./configure
            gmake
            gmake check

  build-netbsd:
    name: Build (NetBSD)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build in a NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add autoconf automake gmake
          run: |
            export PATH=/usr/pkg/bin:$PATH
            autoreconf -fi
            ./configure
            gmake
            gmake check

  sanitizers:
    name: Sanitizers (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - almalinux:9
          - almalinux:10
    steps:
      - name: Install git (needed by the checkout action)
        run: dnf -y install git

      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf -y install gcc make autoconf automake diffutils grep libasan libubsan

      - name: Regenerate the build system
        run: autoreconf -fi

      - name: Configure with ASan + UBSan
        run: ./configure --enable-asan --enable-ubsan

      - name: Build
        run: make

      - name: Test under ASan + UBSan
        run: make check
        env:
          ASAN_OPTIONS: abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
